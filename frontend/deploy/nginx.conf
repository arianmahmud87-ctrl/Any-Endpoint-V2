# Docker's embedded DNS: "resolve" re-resolves container IPs at runtime (nginx >= 1.27.3),
# so recreated web/proxy containers don't leave nginx holding stale upstream addresses.
resolver 127.0.0.11 valid=10s;

upstream web_api { zone web_api 64k; server web:3000 resolve; keepalive 32; }
upstream proxy_api { zone proxy_api 64k; server proxy:8080 resolve; keepalive 32; }

server {
  listen 80;
  server_name anyendpoint.online www.anyendpoint.online;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://anyendpoint.online$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name anyendpoint.online www.anyendpoint.online;

  ssl_certificate     /etc/letsencrypt/live/anyendpoint.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/anyendpoint.online/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 300k;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_comp_level 5;

  # Vite emits fingerprinted files — safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/ {
    proxy_pass http://web_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
  }

  location /v1/ {
    proxy_pass http://proxy_api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /health {
    proxy_pass http://web_api;
  }

  # index.html must always be revalidated so fresh deploys are picked up.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
