upstream web_api { server web:3000; }
upstream proxy_api { server proxy:8080; }

server {
  listen 80;
  server_name anyendpoint.online www.anyendpoint.online;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://anyendpoint.online$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name anyendpoint.online www.anyendpoint.online;

  ssl_certificate     /etc/letsencrypt/live/anyendpoint.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/anyendpoint.online/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 300k;

  location /api/ {
    proxy_pass http://web_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
  }

  location /v1/ {
    proxy_pass http://proxy_api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /health {
    proxy_pass http://web_api;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
